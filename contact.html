  <!-- Modal Form -->
  <div class="modal fade" id="contactModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title">Get Started Today</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="modalContactForm" action="https://formspree.io/f/xvgrvgro" method="POST">
            
            <input type="hidden" name="_replyto" value="alexanderwhiting@icloud.com">
            <input type="hidden" name="_subject" value="New Tutoring Request">
            
            <div class="form-group mb-4">
              <label class="form-label visible-label">Full Name*</label>
              <input type="text" class="form-control" name="name" required>
            </div>
            
            <div class="form-group mb-4">
              <label class="form-label visible-label">Email*</label>
              <input type="email" class="form-control" name="email" required>
            </div>
            
            <div class="form-group mb-4">
              <label class="form-label visible-label">Phone</label>
              <input type="tel" class="form-control" name="phone">
            </div>
            
            <div class="form-group mb-4">
              <label class="form-label visible-label">Service Needed*</label>
              <select class="form-select" name="service" required>
                <option value="" disabled selected>Select service</option>
                <option value="Math Tutoring">Math Tutoring</option>
                <option value="Science Tutoring">Science Tutoring</option>
                <option value="Test Prep">Test Preparation</option>
                <option value="College Consulting">College Consulting</option>
              </select>
            </div>
            
            <div class="form-group mb-4">
              <label class="form-label visible-label">Message*</label>
              <textarea class="form-control" name="message" rows="4" required></textarea>
            </div>
            
            <input type="text" name="_gotcha" style="display:none">
            
            <div class="d-grid">
              <button type="submit" class="btn submit-btn">
                <span class="submit-text" style="color: white;">Send Request</span>
                <span class="spinner-border spinner-border-sm d-none" role="status"></span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('modalContactForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const form = e.target;
      const submitBtn = form.querySelector('button[type="submit"]');
      const submitText = submitBtn.querySelector('.submit-text');
      const spinner = submitBtn.querySelector('.spinner-border');
      
      submitText.textContent = 'Sending...';
      spinner.classList.remove('d-none');
      submitBtn.disabled = true;
      
      try {
        const response = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });
        
        if (response.ok) {
          // Success message
          form.innerHTML = `
            <div class="text-center py-4" style="color: white;">
              <i class="fas fa-check-circle mb-3" style="font-size: 3rem;"></i>
              <h3>Thank You!</h3>
              <p>Your request has been sent to Cynthia. You'll receive a response within 24 hours.</p>
              <button class="success-close-btn mt-3" data-bs-dismiss="modal">
                Close
              </button>
            </div>
          `;
          // Optional: Track conversion
          if (typeof gtag !== 'undefined') {
            gtag('event', 'conversion', {'send_to': 'AW-YOUR_GOOGLE_ADS_ID'});
          }
        } else {
          throw new Error('Form submission failed');
        }
      } catch (error) {
        form.innerHTML = `
          <div class="alert alert-danger">
            <i class="fas fa-exclamation-triangle me-2"></i>
            Message failed to send. Please email directly to:
            <a href="mailto:alexanderwhiting@icloud.com">alexanderwhiting@icloud.com</a>
          </div>
          <button class="btn btn-secondary mt-3" onclick="location.reload()">Try Again</button>
        `;
      } finally {
        submitText.textContent = 'Send Request';
        spinner.classList.add('d-none');
        submitBtn.disabled = false;
      }
    });

    // Reset form when modal closes
    document.getElementById('contactModal').addEventListener('hidden.bs.modal', function() {
      const form = document.getElementById('modalContactForm');
      if (form) form.reset();
    });
  </script>

  <script>
    // Mobile menu toggle functionality
    document.getElementById('mobileMenuButton').addEventListener('click', function() {
      const dropdown = document.getElementById('mobileDropdown');
      dropdown.classList.toggle('active');
      
      // Toggle between hamburger and close icon
      const icon = this.querySelector('i');
      if (dropdown.classList.contains('active')) {
        icon.classList.remove('fa-bars');
        icon.classList.add('fa-times');
      } else {
        icon.classList.remove('fa-times');
        icon.classList.add('fa-bars');
      }
    });
    
    // Close dropdown when clicking outside
    document.addEventListener('click', function(event) {
      const dropdown = document.getElementById('mobileDropdown');
      const menuButton = document.getElementById('mobileMenuButton');
      
      if (!menuButton.contains(event.target) && !dropdown.contains(event.target)) {
        dropdown.classList.remove('active');
        const icon = menuButton.querySelector('i');
        icon.classList.remove('fa-times');
        icon.classList.add('fa-bars');
      }
    });
  </script>
