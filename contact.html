  <!-- Modal Form -->
  <div class="modal fade" id="contactModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title">Get Started Today</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <form id="modalContactForm" action="https://formspree.io/f/xanbbvee" method="POST">
            
            <input type="hidden" name="_replyto" value="cynthcomeau@gmail.com">
            <input type="hidden" name="_subject" value="New Tutoring Request">
            
            <div class="form-group mb-4">
              <label class="form-label visible-label">Full Name*</label>
              <input type="text" class="form-control" name="name" required>
            </div>
            
            <div class="form-group mb-4">
              <label class="form-label visible-label">Email*</label>
              <input type="email" class="form-control" name="email" required>
            </div>
            
            <div class="form-group mb-4">
              <label class="form-label visible-label">Phone</label>
              <input type="tel" class="form-control" name="phone">
            </div>
            
            <div class="form-group mb-4">
              <label class="form-label visible-label">Brief Description About Yourself</label>
              <textarea class="form-control" name="message" rows="4"></textarea>
            </div>
            
            <input type="text" name="_gotcha" style="display:none">
            
            <div class="d-grid">
              <button type="submit" class="btn submit-btn">
                <span class="submit-text" style="color: white;">Send Request</span>
                <span class="spinner-border spinner-border-sm d-none" role="status"></span>
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="scripts/form.js"></script>
